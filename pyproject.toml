[project]
name = "fact-checker-mcp"
version = "2.0.0"
description = "Hybrid CrewAI + MCP Fact Checker Server"
authors = [
    {name = "Joop Snijder", email = "joop@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core MCP dependencies
    "fastmcp>=2.11.0",
    "mcp>=1.12.0",

    # LLM and AI dependencies
    "anthropic>=0.40.0",
    "portkey-ai>=1.0.0",
    "openai>=1.99.0",  # Kept for backward compatibility
    "tiktoken>=0.11.0",

    # Search dependencies
    "multi-search-api>=1.0.0",
    "beautifulsoup4>=4.13.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",

    # Data models and validation
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",

    # Utility libraries
    "rich>=14.0.0",
    "typer>=0.15.0",
    "tenacity>=9.1.0",

    # Web UI
    "gradio>=4.44.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.1.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["fact-checker.py", "smart_search_tool.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "B"]
ignore = ["E501"]  # Line length handled by formatter

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v --cov=fact_checker"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
dev-dependencies = [
    "ruff>=0.12.0",
    "pytest>=8.3.0", 
    "pytest-cov>=6.1.0",
    "pytest-asyncio>=0.25.0",
]